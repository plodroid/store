name: Build Android apps (customer + owner)

# Builds the two Capacitor Android apps in apps/ into installable debug APKs.
#   customer = https://plodroid.github.io/store/        (apps/customer)
#   owner    = https://plodroid.github.io/store/admin/  (apps/owner)
# The apps load the live website, so a website change never needs a new app build:
# this only runs when something inside apps/ (or this file) changes.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/mobile-apps.yml"
  workflow_dispatch:

permissions:
  contents: write   # attaches the APKs to a GitHub Release

concurrency:
  group: mobile-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [customer, owner]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install + sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Compile debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk "../bee-hive-${{ matrix.app }}-debug.apk"

      # If compiling fails, surface the compiler errors as run annotations (readable through the GitHub API).
      - name: Report compile errors
        if: failure()
        working-directory: apps/${{ matrix.app }}/android
        run: |
          grep -E "^e: |error:|\* What went wrong|Could not|FAILED" -A3 build.log | grep -v "^--$" | head -80 > errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build error (${{ matrix.app }})::${msg}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bee-hive-${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/bee-hive-${{ matrix.app }}-debug.apk
          retention-days: 30

      - name: Attach APK to a release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apps-${{ github.run_number }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" \
            --title "Android apps, build ${{ github.run_number }}" \
            --notes "Debug builds of the Bee Hive customer app and the owner app for Android 7+. Signed with the shared debug key, so they install on any phone but are not Play Store builds. See apps/README.md."
          gh release upload "$TAG" "bee-hive-${{ matrix.app }}-debug.apk" --clobber
