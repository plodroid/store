name: Build owner app APK

# Compiles the Android owner app into an installable debug APK — nothing else.
# No tests, no website deploys. Runs only when the Android code or this file changes.
on:
  push:
    branches: [main, owner-app]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # used only on main, to attach the APK to a GitHub Release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
            echo "Bundling google-services.json from the repository secret."
          else
            echo "No bundled config — the owner connects the shop from inside the app."
          fi

      - name: Compile debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk plodroid-store-owner-debug.apk

      # If compiling fails, surface the compiler errors as run annotations
      # (readable through the GitHub API) so they can be fixed quickly.
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|\* What went wrong" -A2 build.log | grep -v "^--$" | head -80 > errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build error::${msg}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: plodroid-store-owner-debug-apk
          path: android/plodroid-store-owner-debug.apk
          retention-days: 30

      - name: Attach APK to a release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="owner-app-debug-${{ github.run_number }}"
          gh release create "$TAG" plodroid-store-owner-debug.apk \
            --target "${{ github.sha }}" \
            --title "Store Owner app — debug build ${{ github.run_number }}" \
            --notes "Debug build of the Plodroid Store owner app for Android 6.0+. Signed with Android's standard debug key — not a production-signed release. See README → 'Install the app on a phone'."
