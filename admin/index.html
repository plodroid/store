<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manage shop · Bee Hive</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF8E6">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"){document.documentElement.dataset.theme="dark";document.querySelector('meta[name="theme-color"]').content="#161616"}}catch(e){}
function native(){try{if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())document.documentElement.dataset.native="1"}catch(e){}}native();addEventListener("DOMContentLoaded",native);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Dancing+Script:wght@700&display=swap" media="print" onload="this.media='all'">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="stylesheet" href="../styles.css?v=14">
<link rel="stylesheet" href="../admin.css?v=14">
</head>

<body class="adm-page">
<!-- sign-in screen: shown until the owner is signed in -->
<div class="ambient" aria-hidden="true"><i></i><i></i></div>
<main class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-brand"><svg class="wordmark" viewBox="-2 -14 296 74" role="img" aria-label="Bee Hive" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8V52"/><circle cx="25" cy="37" r="15"/><path d="M84 37A15 15 0 1 0 80.5 46.6"/><path d="M128 37A15 15 0 1 0 124.5 46.6"/><path d="M144 8V52M144 38A14 14 0 0 1 172 38V52"/><path d="M188 25V52"/><path d="M202 25L218 52L234 25"/><path d="M278 37A15 15 0 1 0 274.5 46.6"/></g><g fill="none" stroke="var(--accent,#F5B800)" stroke-width="8" stroke-linecap="round"><path d="M54 37H84"/><path d="M98 37H128"/><path d="M248 37H278"/></g><g transform="translate(188 5)"><ellipse cx="-10" cy="-6" rx="8.5" ry="3.8" transform="rotate(-26 -10 -6)" fill="var(--accent,#F5B800)" opacity=".55"/><ellipse cx="10" cy="-6" rx="8.5" ry="3.8" transform="rotate(26 10 -6)" fill="var(--accent,#F5B800)" opacity=".55"/><polygon points="0.00,-10.50 9.09,-5.25 9.09,5.25 0.00,10.50 -9.09,5.25 -9.09,-5.25" fill="var(--accent,#F5B800)" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/><path d="M-7.5 -1.8H7.5M-7.5 3.6H7.5" stroke="currentColor" stroke-width="2.4"/></g></svg></div>
    <p class="gate-sub">Shop owner area</p>
    <p class="gate-msg" id="gateMsg" role="status">Loading…</p>
    <button class="btn-primary wide" id="gateGoogle" type="button" hidden>Continue with Google</button>
    <button class="btn-primary wide" id="gateRetry" type="button" hidden onclick="location.reload()">Try again</button>
    <button class="btn-quiet" id="gateOut" type="button" hidden>Sign out</button>
    <p class="gate-why" id="gateWhy" hidden></p>
    <a class="gate-back" id="gateBack" href="../">Go to the shop</a>
  </div>
</main>

<div class="admin" id="admin" hidden></div>
<dialog class="pd modal adm-dlg" id="admDlg" aria-label="Edit">
  <button class="icon-btn pd-close" type="button" data-close aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="modal-body" id="admDlgBody"></div>
</dialog>
<dialog class="pd modal confirm" id="admConfirm" aria-label="Please confirm">
  <div class="modal-body" id="admConfirmBody"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../firebase-config.js?v=14"></script>
<script type="module" src="./main.js?v=14"></script>
</body>
</html>
