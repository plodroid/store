<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plodroid Store</title>
<meta name="description" content="Everyday essentials, all in one place. Food, drinks, groceries and more.">
<meta name="theme-color" content="#171717">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23202020'/%3E%3Cg fill='none' stroke='%238AB4F8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 12h12l-1 11H11z'/%3E%3Cpath d='M13 12a3 3 0 0 1 6 0'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Google Sans Flex first; Figtree is only downloaded if that one is unavailable -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>

<body>
<a class="skip" href="#shop">Skip to products</a>

<header class="nav" id="nav">
  <div class="announce" id="announce" hidden><span data-bind="announcement"></span></div>
  <div class="wrap nav-inner">

    <a href="#shop" class="nav-link nav-first">Shop</a>

    <button class="icon-btn" id="navSearch" type="button" aria-label="Search products">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>

    <button class="cart-btn" id="cartBtn" type="button" aria-label="Open basket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
      <span class="count" id="cartCount">0</span>
    </button>
  </div>
</header>

<main id="top">

  <section class="hero" aria-labelledby="heroTitle">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-inner">
      <h1 class="hero-title enter" id="heroTitle" style="--i:0" data-bind="heroTitle">Everyday essentials,<br>all in one place.</h1>
      <p class="hero-sub enter" style="--i:1" data-bind="heroSubtitle">Explore food, drinks, groceries and more.</p>

      <form class="ask enter" style="--i:2" id="heroSearch" role="search">
        <svg class="ask-lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="heroQ" type="search" placeholder="Search products" autocomplete="off" enterkeyhint="search" aria-label="Search products">
        <button class="ask-go" type="submit" aria-label="Show results">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
      </form>

      <ul class="suggest enter" style="--i:3" id="suggest" aria-label="Start browsing"></ul>
    </div>
  </section>

  <section id="shop" class="shop" aria-labelledby="shopTitle">
    <div class="toolbar">
      <div class="wrap">
        <div class="toolbar-inner">
          <div class="tabs" aria-label="Categories">
            <div class="tab-list" id="catList"><span class="tab-ind" id="tabInd" aria-hidden="true"></span></div>
          </div>
          <div class="tools">
            <label class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-label="Search products">
            </label>
            <label class="select">
              <select id="sort" aria-label="Sort products">
                <option value="feat">Featured</option>
                <option value="lo">Price: low to high</option>
                <option value="hi">Price: high to low</option>
                <option value="az">Name: A to Z</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="shop-head">
        <h2 id="shopTitle">All products</h2>
        <span class="muted" id="resultCount"></span>
      </div>
      <p class="note" id="sampleNote" hidden>Sample products and prices shown for preview.</p>

      <div class="grid" id="grid" aria-live="polite"></div>

      <div class="empty" id="empty" hidden>
        <p class="empty-title" id="emptyTitle"></p>
        <p class="muted" id="emptyText"></p>
        <button class="btn-ghost" id="emptyAction" type="button" hidden>Clear search</button>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span>© <span id="yr"></span> <span data-bind="storeName">Plodroid Store</span></span>
    <a id="contact" class="footer-link" href="#" target="_blank" rel="noopener" hidden>Contact us on WhatsApp</a>
  </div>
</footer>

<!-- basket -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Basket" aria-hidden="true">
  <div class="drawer-head">
    <h2>Basket</h2>
    <button class="icon-btn" id="closeCart" type="button" aria-label="Close basket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-list" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total"><span class="muted">Total</span><span id="cartTotal">£0.00</span></div>
    <button class="btn-primary" id="checkout" type="button">Order on WhatsApp</button>
  </div>
</aside>

<!-- product details -->
<dialog class="pd" id="pd" aria-labelledby="pdName">
  <button class="icon-btn pd-close" type="button" data-close aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="pd-body" id="pdBody"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./firebase-config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
