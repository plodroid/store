svg{width:84px;height:84px;margin-bottom:18px}h1{font-size:23px;margin:0 0 8px;letter-spacing:-.02em}p{margin:0 auto 22px;max-width:30ch;color:#5b625e}

<h1>You're offline</h1><p>Bee Hive Owner needs the internet. Check your Wi-Fi or mobile data.</p><button id="b">Try again</button><small id="s">We'll reconnect automatically.</small></div>
<script>var U="https://plodroid.github.io/store/admin/",go=function(){location.href=U};document.getElementById("b").onclick=function(){this.textContent="Trying…";fetch(U,{mode:"no-cors",cache:"no-store"}).then(go,function(){document.getElementById("b").textContent="Try again";document.getElementById("s").textContent="Still no connection."})};
